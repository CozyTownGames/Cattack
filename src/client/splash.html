<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, height=device-height, user-scalable=0"
    />
    <title>Cattack! — Launch Terminal</title>
    <link rel="stylesheet" href="game.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0b1e;
        font-family: inherit;
      }
      #phaser-preview-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: block;
      }
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      #ui-root * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="phaser-preview-container"></div>
    <div id="ui-root"></div>
    <script type="module" src="splash.tsx" defer></script>
  </body>
</html>
